[package]
name = "tor_provider"
description = "Firefox-indepentent tor integration."
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1.4.0"
data-encoding = "2.3.3"
hex = "0.4.3"
itoa = "1.0.15"
lazy_static = "1"
log = "0.4"
memchr = "2.7.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
sha3 = "0.10.8"
smallvec = { version = "1.15.1", features = ["serde"] }
thiserror = "2"
tinystr = { version = "0.8.1", features = ["serde"] }
